name: Post-Deploy Verification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      expected_sha:
        description: 'Exact deployed commit SHA (required for manual verification)'
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  wait-for-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Wait for Railway deploy
        run: sleep 120  # Wait 2 min for Railway to rebuild

  backend-health:
    needs: wait-for-deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Check backend health
        run: |
          BACKEND_URL="${{ vars.BACKEND_URL }}"
          EXPECTED_SHA="${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL variable is required."
            exit 1
          fi
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::Expected deployed SHA is required."
            exit 1
          fi
          echo "Checking backend health at $BACKEND_URL..."
          for i in {1..10}; do
            RESPONSE=$(curl -sS -w '\n%{http_code}' "$BACKEND_URL/health" || true)
            STATUS=$(printf '%s\n' "$RESPONSE" | tail -n 1)
            BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
            if [ "$STATUS" = "200" ]; then
              ACTUAL_SHA=$(printf '%s' "$BODY" | jq -r '.commit_sha // empty')
              if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
                echo "::error::Runtime commit_sha '$ACTUAL_SHA' does not match expected '$EXPECTED_SHA'."
                exit 1
              fi
              echo "Backend is healthy and running $ACTUAL_SHA"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS - retrying in 10s..."
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

  e2e-smoke-tests:
    needs: backend-health
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent-browser
        run: |
          test -n "${{ vars.FRONTEND_URL }}" || { echo "::error::FRONTEND_URL variable is required."; exit 1; }
          test -n "$TEST_EMAIL" || { echo "::error::TEST_EMAIL secret is required."; exit 1; }
          test -n "$TEST_PASSWORD" || { echo "::error::TEST_PASSWORD secret is required."; exit 1; }
          npm install -g agent-browser
          agent-browser install
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Run smoke tests
        working-directory: frontend
        run: bash tests/agent-browser/run-all.sh
        env:
          CI: true
          BASE_URL: ${{ vars.FRONTEND_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

  notify-failure:
    needs: [backend-health, e2e-smoke-tests]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        run: |
          echo "::error::Post-deploy verification FAILED! Check the workflow logs."
