[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "sh -c 'if [ \"${RUN_DB_MIGRATIONS:-false}\" = \"true\" ]; then alembic upgrade head && python init_db.py; fi'"
startCommand = "sh -c 'if [ \"${RUN_LAUNCH_WORKER:-false}\" = \"true\" ]; then python -m app.worker; else uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}; fi'"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
